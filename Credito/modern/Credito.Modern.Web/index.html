<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e4d7b" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://maps.googleapis.com https://maps.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https: http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:*; worker-src 'self' blob:; frame-src 'self' blob: https://maps.googleapis.com https://www.google.com https://maps.google.com; object-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    />
    <title>CREDIX — Inversiones CrediConfiable</title>
    <meta name="description" content="Sistema comercial de ventas y crédito." />
    <!-- Warm connection to production API (Vercel deploy). Harmless if unused locally. -->
    <link
      rel="preconnect"
      href="https://crediconfiable-api-g3h7fja3dydsbbb7.centralus-01.azurewebsites.net"
      crossorigin
    />
    <link
      rel="dns-prefetch"
      href="https://crediconfiable-api-g3h7fja3dydsbbb7.centralus-01.azurewebsites.net"
    />
  </head>
  <body>
    <div id="root">
      <!-- Primer paint inmediato (FCP) mientras carga el bundle; React lo reemplaza. -->
      <div class="credix-boot" aria-busy="true" aria-label="Cargando aplicación">
        <div class="credix-boot__bar" aria-hidden="true"></div>
      </div>
    </div>
    <style>
      .credix-boot {
        min-height: 100vh;
        margin: 0;
        background: #f0f2f5;
      }
      .credix-boot__bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(90deg, #1e4d7b, #2e69ae, #1e4d7b);
        background-size: 200% 100%;
        animation: credix-boot-slide 1.1s linear infinite;
      }
      @keyframes credix-boot-slide {
        0% {
          background-position: 100% 0;
        }
        100% {
          background-position: -100% 0;
        }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

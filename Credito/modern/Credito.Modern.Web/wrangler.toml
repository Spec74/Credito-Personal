# Cloudflare Workers + Assets (flujo Git actual del dashboard).
# Build: npm run build → dist/
# Deploy CI: npx wrangler deploy
#
# SPA: not_found_handling sirve index.html en rutas del router.
# No incluir public/_redirects: con Workers Assets provoca error 100324 (loop).

name = "credito-personal"
compatibility_date = "2026-11-24"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

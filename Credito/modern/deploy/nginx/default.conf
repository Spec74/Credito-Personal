# Strangler fig — staging/local.
# /api/v1/*, /health, /swagger → Credito.Modern.Api
# /app/* → SPA (dist)
# Resto → MVC .NET 4.8 (puerto del servidor local de VS / IIS Express).

upstream credito_modern_api {
    server credito-modern-api:8080;
}

# Puerto MVC: debe coincidir con donde corre Web en Visual Studio.
# - Servidor web de desarrollo (F5 típico): Web.csproj → DevelopmentServerPort (4779 en este repo).
# - IIS Express (perfil IIS): Web.csproj → IISUrl (52099 en este repo).
# Cambiar puerto: .\deploy\scripts\set-mvc-upstream-port.ps1 -Port TU_PUERTO
upstream credito_mvc_legacy {
    server host.docker.internal:4779;
}

server {
    listen 80;
    server_name _;
    absolute_redirect off;
    client_max_body_size 16m;

    location /health {
        proxy_pass http://credito_modern_api;
        include /etc/nginx/proxy_params_strangler.conf;
    }

    location /swagger {
        proxy_pass http://credito_modern_api;
        include /etc/nginx/proxy_params_strangler.conf;
    }

    location /api/v1/ {
        proxy_pass http://credito_modern_api;
        include /etc/nginx/proxy_params_strangler.conf;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Iconos y fuentes del menú (Web/css, Web/img) — montados en docker-compose
    location /css/ {
        alias /var/www/legacy-web/css/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /img/ {
        alias /var/www/legacy-web/img/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Corte B local: SPA en /app/ (dist montado en docker-compose)
    location /app/ {
        alias /var/www/credito-modern-web/;
        index index.html;
        try_files $uri $uri/ /app/index.html;
    }

    # Exportación RDLC/PDF: ?__legacyExport=rdlc evita redirect a SPA (ver spa-legacy-redirects.conf).
    error_page 418 = @legacy_rdlc_export;
    location @legacy_rdlc_export {
        proxy_pass http://credito_mvc_legacy;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:52099;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # 5C-7.5 cutover local: redirects MVC migrado → SPA (antes del proxy MVC)
    include /etc/nginx/spa-legacy-redirects.conf;

    # MVC legado: headers inline (un solo archivo montado → menos fallos al añadir volúmenes).
    location / {
        proxy_pass http://credito_mvc_legacy;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:4779;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect http://localhost:4779/ http://$http_host/;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}

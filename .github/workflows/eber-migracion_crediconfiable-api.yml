# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - crediconfiable-api

on:
  push:
    branches:
      - Eber-migracion
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        working-directory: Credito/modern
        run: dotnet build Credito.Modern.sln --configuration Release

      - name: dotnet publish
        working-directory: Credito/modern
        run: dotnet publish Credito.Modern.Api/Credito.Modern.Api.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F68250468F354310BDF7812102C4664F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_6BBD650F1979451E8FEFE5491AA97995 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_25C67C63DE68435CABF27F0F397EF9A8 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'crediconfiable-api'
          slot-name: 'Production'
          package: .

      - name: Configure startup and restart
        run: |
          RG=$(az webapp list --query "[?name=='crediconfiable-api'].resourceGroup | [0]" -o tsv)
          echo "Resource group: $RG"
          az webapp config set \
            --resource-group "$RG" \
            --name crediconfiable-api \
            --startup-file "dotnet Credito.Modern.Api.dll"
          az webapp restart --resource-group "$RG" --name crediconfiable-api
          sleep 15
          curl -sS -o /tmp/health.txt -w "health_http=%{http_code}\n" \
            "https://crediconfiable-api-g3h7fja3dydsbbb7.centralus-01.azurewebsites.net/health" || true
          head -c 400 /tmp/health.txt || true
          echo          
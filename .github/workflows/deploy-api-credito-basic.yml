# Deploy Credito.Modern.Api → App Service api-credito-basic (cuenta nueva B1).
# Secret requerido (repo): AZURE_WEBAPP_PUBLISH_PROFILE_CREDITO_BASIC
#   Portal → api-credito-basic → Descargar perfil de publicación → pegar XML completo como secret.
#
# Manual: Actions → "Deploy API api-credito-basic" → Run workflow

name: Deploy API api-credito-basic

on:
  workflow_dispatch:
  push:
    branches:
      - Eber-migracion
    paths:
      - 'Credito/modern/Credito.Modern.Api/**'
      - 'Credito/modern/Credito.Modern.Application/**'
      - 'Credito/modern/Credito.Modern.Infrastructure/**'
      - 'Credito/modern/Credito.Modern.Domain/**'
      - '.github/workflows/deploy-api-credito-basic.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build
        working-directory: Credito/modern
        run: dotnet build Credito.Modern.sln --configuration Release

      - name: Test (gate)
        working-directory: Credito/modern
        run: >
          dotnet test Credito.Modern.Tests/Credito.Modern.Tests.csproj
          -c Release --no-build --verbosity minimal

      - name: Publish
        working-directory: Credito/modern
        run: >
          dotnet publish Credito.Modern.Api/Credito.Modern.Api.csproj
          -c Release -o ${{ runner.temp }}/api-credito-basic

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: api-credito-basic
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_CREDITO_BASIC }}
          package: ${{ runner.temp }}/api-credito-basic

# Build Dockerfile (tesseract-ocr + spa) y publica en GHCR.
# Imagen: ghcr.io/spec74/credito-api:basic
#
# Tras el push: Portal → api-credito-basic → Contenedor → esa imagen, puerto 8080.

name: Publish API container (GHCR)

on:
  workflow_dispatch:
  push:
    branches:
      - Eber-migracion
    paths:
      - 'Credito/modern/Dockerfile'
      - 'Credito/modern/Credito.Modern.Api/**'
      - 'Credito/modern/Credito.Modern.Application/**'
      - 'Credito/modern/Credito.Modern.Infrastructure/**'
      - 'Credito/modern/Credito.Modern.Domain/**'
      - '.github/workflows/publish-api-container.yml'

env:
  IMAGE: ghcr.io/spec74/credito-api
  TAG: basic

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: Credito/modern
          file: Credito/modern/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
